name: Linux VPS release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            pom.xml
            candybox.lock
      - name: Select and validate release version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, subprocess, xml.etree.ElementTree as ET
          base = ET.parse('pom.xml').findtext('{*}version').removesuffix('-SNAPSHOT')
          tag = os.environ['REF_NAME'] if os.environ['REF_TYPE'] == 'tag' else 'v' + base + '-preview.' + os.environ['GITHUB_RUN_NUMBER']
          subprocess.run(['python3', 'scripts/release.py', '--tag', tag, '--validate-only'], check=True)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('tag=' + tag + '\n')
          PY
      - name: Build and verify pinned sources
        run: make build
      - name: Test tools and installer
        run: make test-tools
      - name: Assemble release assets
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: make release TAG="$RELEASE_TAG" RELEASE_FLAGS=--require-clean
      - name: Verify outer release checksums
        working-directory: target/dist
        run: sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-vps-release
          path: target/dist/*
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-vps-release
          path: dist
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          test "$(jq -r .tag release.json)" = "$RELEASE_TAG"
          test "$(jq -r .dirtySource release.json)" = false
          source_sha="$(jq -r .sourceCommit release.json)"
          remote_sha="$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)"
          test "$source_sha" = "$remote_sha"
          flags=()
          if test "$(jq -r .prerelease release.json)" = true; then
            flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" ./* --verify-tag --target "$source_sha" \
            --draft --title "JellyDB $RELEASE_TAG" --notes-file release-notes.md "${flags[@]}"
          gh release edit "$RELEASE_TAG" --draft=false
