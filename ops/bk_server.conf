# Apache BookKeeper 4.17.1. Set advertisedAddress to this host's private address.
bookiePort=3181
advertisedAddress=10.20.0.11
listeningInterface=eth1
allowLoopback=false
metadataServiceUri=zk://10.20.0.11:2181;10.20.0.12:2181;10.20.0.13:2181/ledgers
journalDirectories=/var/lib/jellydb/bookkeeper/journal
ledgerDirectories=/var/lib/jellydb/bookkeeper/ledgers
indexDirectories=/var/lib/jellydb/bookkeeper/index
journalMaxSizeMB=64
logSizeLimit=134217728
openFileLimit=128
numReadWorkerThreads=2
numAddWorkerThreads=2
numJournalCallbackThreads=1
httpServerEnabled=false
# Recovery needs spare writable capacity; three bookies with E=3 have no spare.
autoRecoveryDaemonEnabled=true
minorCompactionInterval=3600
majorCompactionInterval=86400
